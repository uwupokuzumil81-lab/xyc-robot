<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XYC · 四路相机</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: #0b1119; color: #eaf0f8; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 18px 24px; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    header { display: flex; flex-shrink: 0; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 14px; }
    h1 { font-size: 23px; margin: 0 0 6px; font-weight: 650; }
    header p { margin: 0; color: #9daec3; font-size: 13px; }
    #connection { border: 1px solid #334154; padding: 8px 13px; border-radius: 20px; white-space: nowrap; font-size: 13px; }
    main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 14px; max-width: 1480px; width: 100%; margin: auto; flex: 1; min-height: 0; }
    article { display: flex; flex-direction: column; min-height: 0; background: #121d2b; border: 1px solid #2a394d; border-radius: 12px; overflow: hidden; }
    .bar { display: flex; justify-content: space-between; align-items: center; padding: 11px 15px; }
    .name { font-size: 15px; font-weight: 600; }
    .stats { font: 12px "Segoe UI", sans-serif; color: #9daec3; }
    .view { position: relative; background: #070b10; flex: 1; min-height: 0; }
    img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #08111bd9; color: #b0bfd2; font-size: 18px; }
    .live .overlay { display: none; }
    .dot { display: inline-block; width: 8px; height: 8px; margin-right: 9px; border-radius: 50%; background: #6b7b90; }
    .live .dot { background: #4dd9ae; box-shadow: 0 0 10px #4dd9ae55; }
    footer { flex-shrink: 0; max-width: 1480px; margin: 12px auto 0; font-size: 12px; line-height: 1.8; color: #94a6bd; }
    article:fullscreen { display: flex; flex-direction: column; border: 0; border-radius: 0; }
    article:fullscreen .view { flex: 1; min-height: 0; aspect-ratio: auto; }
    @media (max-width: 680px) { body { padding: 10px; } main { gap: 8px; } header { gap: 8px; } h1 { font-size: 18px; } header p, footer { font-size: 11px; } .bar { padding: 8px; flex-wrap: wrap; gap: 3px; } .name { font-size: 13px; } .stats { font-size: 11px; } .overlay { font-size: 12px; text-align: center; padding: 8px; } #connection { font-size: 11px; padding: 6px 8px; } }
  </style>
</head>
<body>
  <header>
    <div><h1>XYC · 四路相机</h1><p>遥操实时预览 · 双击画面全屏</p></div>
    <span id="connection">正在连接</span>
  </header>
  <main id="grid"></main>
  <footer>本窗口只显示画面。控制底盘、升降时，请切回遥操终端按键；相机预览不会发送电机指令。</footer>
  <script>
    const cameras = [['forward', '前方'], ['chest', '胸前'], ['wrist_left', '左腕'], ['wrist_right', '右腕']];
    const grid = document.querySelector('#grid');
    const images = {}, lastDisplay = {};
    for (const [name, label] of cameras) {
      const card = document.createElement('article');
      card.id = name;
      card.innerHTML = `<div class="bar"><span class="name"><i class="dot"></i>${label}</span><span class="stats">等待图像</span></div><div class="view"><img alt="${label}相机实时画面"><div class="overlay">正在等待相机图像…</div></div>`;
      const image = card.querySelector('img');
      images[name] = image;
      card.addEventListener('dblclick', () => { if (document.fullscreenElement) document.exitFullscreen(); else card.requestFullscreen?.(); });
      grid.append(card);
    }
    let streamGeneration = 0;
    async function connectStream() {
      const generation = ++streamGeneration;
      try {
        const response = await fetch(`/stream/all?t=${Date.now()}`, { cache: 'no-store' });
        if (!response.ok || !response.body) throw new Error('HTTP');
        const reader = response.body.getReader();
        let pending = new Uint8Array();
        while (generation === streamGeneration) {
          const { value, done } = await reader.read();
          if (done) throw new Error('EOF');
          const joined = new Uint8Array(pending.length + value.length);
          joined.set(pending); joined.set(value, pending.length); pending = joined;
          let offset = 0;
          while (pending.length - offset >= 5) {
            const view = new DataView(pending.buffer, pending.byteOffset + offset, 5);
            const index = view.getUint8(0), length = view.getUint32(1, false);
            if (index >= cameras.length || length < 4 || length > 2 * 1024 * 1024) throw new Error('packet');
            if (pending.length - offset < 5 + length) break;
            const name = cameras[index][0], image = images[name];
            const jpeg = pending.slice(offset + 5, offset + 5 + length);
            const url = URL.createObjectURL(new Blob([jpeg], { type: 'image/jpeg' }));
            const old = image.dataset.objectUrl;
            image.onload = () => { if (old) URL.revokeObjectURL(old); };
            image.dataset.objectUrl = url; image.src = url; lastDisplay[name] = Date.now();
            offset += 5 + length;
          }
          if (offset) pending = pending.slice(offset);
        }
      } catch (_) {
        if (generation === streamGeneration) setTimeout(connectStream, 750);
      }
    }
    connectStream();
    async function update() {
      try {
        const response = await fetch('/api/status', { cache: 'no-store', signal: AbortSignal.timeout(1800) });
        if (!response.ok) throw new Error('HTTP');
        const status = await response.json();
        let count = 0;
        for (const [name] of cameras) {
          const camera = status[name];
          const card = document.getElementById(name);
          const displayed = camera.live && Date.now() - (lastDisplay[name] || 0) < 1500;
          card.classList.toggle('live', displayed);
          if (displayed) count++;
          card.querySelector('.stats').textContent = displayed ? `${camera.fps.toFixed(1)} FPS采集 · 15 FPS预览` : (camera.age_s === null ? '等待图像' : '图像超时');
          card.querySelector('.overlay').textContent = camera.age_s === null ? '正在等待相机图像…' : '画面已暂停，等待恢复…';
        }
        document.querySelector('#connection').textContent = `在线 ${count} / 4`;
      } catch (_) {
        document.querySelector('#connection').textContent = '连接中断，正在重试';
        for (const card of grid.children) {
          card.classList.remove('live');
          card.querySelector('.overlay').textContent = '预览连接已中断…';
        }
      } finally { setTimeout(update, 500); }
    }
    update();
  </script>
</body>
</html>
