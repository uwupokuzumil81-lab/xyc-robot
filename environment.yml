name: xyc
channels:
  - https://prefix.dev/robostack-jazzy
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  # colcon 0.19 symlink builds use the pre-80 setuptools develop interface.
  - setuptools>=68,<80
  - ros-jazzy-ros-base
  - ros-jazzy-demo-nodes-py
  - ros-jazzy-cv-bridge
  - ros-jazzy-rosbag2-storage-mcap
  - ros-dev-tools
  - colcon-notification
  - cmake
  - make
  - ninja
  - c-compiler
  - cxx-compiler
  - ros-jazzy-rosidl-default-runtime
  - ros-jazzy-rosidl-default-generators
  - pyserial
  - pyyaml
  - opencv>=4.9,<6
  - numpy>=1.26,<3
  - pytest
  - pip
