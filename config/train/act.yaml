# Cloud GPU training. Paths are relative to the project, independent of terminal cwd.
policy: act
dataset: data/datasets/xyc/pick_toys_20261113_03
output_dir: outputs/train/act_toys
cameras: [forward, chest, wrist_left, wrist_right]
model:
  vision_backbone: resnet18
  pretrained_backbone_weights: ResNet18_Weights.IMAGENET1K_V1
  image_size: [240, 320]
  chunk_size: 50
  n_action_steps: 10
  dim_model: 512
  n_heads: 8
  dim_feedforward: 3200
  n_encoder_layers: 4
  n_decoder_layers: 1
  use_vae: true
  latent_dim: 32
  n_vae_encoder_layers: 4
  kl_weight: 10.0
  dropout: 0.1
  temporal_ensemble_coeff: null
steps: 10000
batch_size: 8
learning_rate: 0.00001
backbone_learning_rate: 0.00001
weight_decay: 0.0001
grad_clip_norm: 10.0
scheduler: constant
warmup_steps: 0
save_every: 1000
eval_every: 1000
eval_batches: 4
log_every: 10
num_workers: 0
seed: 42
validation_fraction: 0.2
device: cuda
precision: float32
cpu_threads: 4
