# Use --dataset and --output to select the dataset and run directory on the GPU host.
policy: pi05
dataset: data/datasets/xyc/blue_block_to_brown_bowl_v1
output_dir: outputs/train/pi05
cameras: [forward, chest, wrist_left, wrist_right]
model:
  pretrained: lerobot/pi05_base
  pretrained_revision: 22c30e5b34f9e7ab738b1b34fc2fc5ecfe2d28f0
  dtype: bfloat16
  chunk_size: 50
  n_action_steps: 10
  num_inference_steps: 10
  gradient_checkpointing: true
  freeze_vision_encoder: false
  train_expert_only: false
steps: 10000
batch_size: 1
learning_rate: 0.000025
backbone_learning_rate: 0.000025
weight_decay: 0.01
grad_clip_norm: 1.0
scheduler: cosine
warmup_steps: 1000
save_every: 5000
eval_every: 5000
eval_batches: 4
log_every: 10
num_workers: 4
seed: 42
validation_fraction: 0.2
device: cuda
# The upstream model selects BF16/FP32 per module. No global autocast is needed.
precision: float32
cpu_threads: 4
